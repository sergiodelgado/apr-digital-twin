[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apr-digital-twin"
version = "0.1.0"
description = "Local MVP digital twin for APR telemetry processing and visualization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "streamlit>=1.40,<2.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "pyarrow>=16.0,<20.0",
    "pydantic>=2.8,<3.0",
    "requests>=2.32,<3.0",
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "src.apr_twin.api.main:app"

